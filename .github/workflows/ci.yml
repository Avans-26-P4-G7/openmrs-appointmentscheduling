name: CI Pipeline

on:
  push:
    branches: [ development, test, production ]
  pull_request:
    branches: [ development, test, production ]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Set up Maven 3.6.3
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.6.3

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      # Volledige build + alle tests + JaCoCo report + jacoco:check.
      # 'verify' draait de testfase (coverage wordt gemeten en gerapporteerd)
      # en de verify-fase (jacoco:check laat de build falen bij < 60% line coverage).
      - name: Build, test & coverage (mvn verify)
        run: mvn clean verify -B -pl api -am

      # Coverage-rapport bewaren als downloadbaar bewijs (HTML/XML/CSV).
      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-jacoco
          path: api/target/site/jacoco/

  codeql:
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Set up Maven 3.6.3
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.6.3

      - name: Build for CodeQL
        # omod's unpack-dependencies plugin requires the api jar, which only exists after package (not compile)
        run: mvn clean package -B -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: security