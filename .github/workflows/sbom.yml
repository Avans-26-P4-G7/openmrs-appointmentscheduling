name: SBOM

on:
  push:
    branches: [ development, test, production ]
  pull_request:
    branches: [ development, test, production ]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  generate-sbom:
    name: Generate CycloneDX SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Set up Maven 3.6.3
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.6.3

      - name: Cache Maven packages
        uses: actions/cache@v5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}

      # Generates one aggregate SBOM for the whole multi-module project.
      # outputName "sbom.cdx" + JSON format => target/sbom.cdx.json (CycloneDX JSON).
      - name: Generate SBOM (CycloneDX JSON)
        run: >
          mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.7.11:makeAggregateBom
          -DoutputFormat=json
          -DoutputName=sbom.cdx
          -DschemaVersion=1.5

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx-json
          path: target/sbom.cdx.json
          if-no-files-found: error
